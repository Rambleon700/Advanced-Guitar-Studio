var LES=[
['Hand posture & tension control','Build the foundation for speed and endurance.',['Sit with the guitar elevated so the fretting wrist stays nearly straight.','Thumb stays behind the neck; never wrap it over unless deliberately muting.','Press only as hard as needed — excess force is the enemy of clean changes and stamina.'],'Play a chromatic 1-2-3-4 pattern on each string for 60 seconds without tension building in the forearm.','fret'],
['Barre chord fluency','Own the movable shapes that unlock every key.',['E-shape and A-shape barres are the two workhorses. Master both clean, then move them chromatically.','Partial barres (top 3–4 strings) are often cleaner and more useful than full six-string grips.','Release the barre the instant the next chord begins — do not hold residual pressure.'],'Cycle F–Bm–F–Bm at 70 BPM for two minutes with zero dead notes. Then move both shapes up two frets and repeat.','chords'],
['Voice leading between chords','Make progressions sound connected and professional.',['Keep common tones stationary; move the other voices by the smallest interval.','Walk the bass line: G → D/F# → Em → C/E creates a smooth descending bass.','Use inversions and sus chords as bridges rather than jumping between root-position grips.'],'Take G–C–Em–D and re-voice it so at least one finger stays planted on every change. Record both versions and compare.','chords'],
['Advanced rhythm: syncopation & subdivision','Move beyond straight 8ths.',['Accent the “and” of 2 and 4, or displace the downbeat by an 8th note.','Practice “Old faithful” with a deliberate missed down-stroke on beat 1 of every other bar.','Count 16th-note subdivisions out loud while strumming 8ths — the hand must stay even.'],'Loop a four-chord progression at 90 BPM using a fully syncopated pattern for eight clean bars.','rhythm'],
['Travis picking with internal melody','Thumb independence plus a sung line.',['Thumb locks on beats 1 and 3 (or every beat). Fingers play the higher voices.','Introduce a simple melody on the top two strings while the Travis pattern continues underneath.','Mute unused strings lightly with the fretting hand so the bass stays clear.'],'Play Travis on G–C–D–G while outlining the G major scale tones on the high e and B strings.','rhythm'],
['Hybrid picking basics','Combine pick and fingers for speed and colour.',['Hold the pick normally; use middle and ring fingers for the higher strings.','Common pattern: pick on low strings, fingers on high — ideal for country, bluegrass and modern acoustic.','Keep the pick hand relaxed; the fingers “pluck” rather than dig.'],'Alternate Travis (fingers only) and hybrid (pick + fingers) on the same progression and notice the attack difference.','rhythm'],
['CAGED mastery across the neck','See every chord as five linked shapes.',['Name the CAGED shape you are in every time you play a barre.','Connect shapes: the highest note of one shape is the lowest of the next.','Practice moving a single chord (e.g. C major) through all five shapes without stopping.'],'In the key of A, play the five CAGED shapes for A major in order, naming the root and shape each time. Then do A minor.','caged'],
['Triads & inversions as arranging tools','Small chords that cut through and move easily.',['Learn all three inversions on every adjacent string set.','Major → minor is only the 3rd moving one fret; diminished also lowers the 5th.','Use triads on the top three strings over a bass note or drone for lush, modern voicings.'],'Over a G drone, cycle G, Am, Bm, C triads in root position, then 1st inversion, then 2nd. Keep the top voice smooth.','triads'],
['Arpeggio fluency & targeting','Chord tones are the safest and strongest notes.',['Know the arpeggio of every chord in a progression cold.','Land on the 3rd or 7th on strong beats — they define quality more than the root.','Practice ascending one arpeggio and descending the next as the chord changes.'],'Over G–C–Em–D, play only the arpeggio of the current chord, changing on beat 1. Aim for continuous, even 8th notes.','arps'],
['Modes from a single parent scale','Hear the centre, not just the notes.',['All seven modes of C major use the same notes; only the home note changes.','Drone the root of the mode and improvise — the character emerges immediately.','Dorian (natural 6) and Mixolydian (flat 7) are the two most useful after Ionian and Aeolian.'],'Drone D and play the D Dorian scale (C major notes starting on D). Then switch the drone to G and play G Mixolydian. Notice the colour shift.','lead'],
['Chord substitutions & secondary dominants','Add sophistication without new shapes.',['V of V (D7 in the key of C) creates strong forward motion.','bVII (Bb in C) is a classic borrowed chord that feels rock and folk at once.','Relative major/minor swaps and tritone substitutes (advanced) keep the ear interested.'],'Rewrite a simple I–V–vi–IV progression by inserting the V of each chord. Play both versions and feel the difference in tension.','build'],
['Drop D and alternate tunings','New resonance and easy power chords.',['Drop the low E to D. Power chords become one-finger shapes.','DADGAD and Open G open up drone-based folk and Celtic sounds.','Retune, then re-map the same chord shapes you already know — many stay almost identical.'],'In Drop D, play a I–bVII–IV progression using only the bottom three strings. Notice how full it sounds with minimal fretting.','chords'],
['Natural & artificial harmonics','Add sparkle and orchestral colour.',['Natural harmonics at frets 5, 7, 12 (and 4, 9, 16) are reliable.','Artificial harmonics: fret a note, then lightly touch 12 frets higher with the picking-hand index while plucking with the thumb or pick.','Use harmonics as chord extensions or melodic punctuation.'],'Play an open G chord, then add the 12th-fret harmonics on the top three strings. Experiment with artificial harmonics on the same chord.','lead'],
['Solo acoustic arranging','Turn a song into a complete one-guitar performance.',['Combine bass, harmony and melody in one pass — Travis + internal melody is the classic route.','Use space: not every beat needs a note. Silence is part of the arrangement.','Record a simple song, then re-record it with bass motion, a countermelody and a harmonic ending.'],'Take any four-chord song you know and arrange it for solo guitar: clear bass, chordal middle, and a short melodic fill between phrases.','song'],
['Advanced ear training','Intervals, chord quality and progressions by ear.',['Sing the interval before you play it. Link every interval to a song you already know.','Identify major / minor / dominant 7 / major 7 / sus by quality alone.','Transcribe short progressions by humming the bass line first, then the quality of each chord.'],'Reach a streak of 15 on both intervals and chord quality. Then try to name the chords of a simple song after one listen.','ear'],
['Practice design for intermediate players','Deliberate practice beats mindless repetition.',['Isolate the exact moment of failure (the change, the barre, the syncopation) and loop only that.','Use a timer: 5 focused minutes on one micro-skill beats 30 minutes of wandering.','End every session by playing something musical that you already own — leave wanting more.'],'Design a 25-minute session: 5 min warm-up, 10 min on your weakest barre change, 5 min syncopated rhythm, 5 min free play of a song.','practice'],
['The circle of fifths as a composing tool','Generate progressions and key changes instantly.',['I–IV–V live on three adjacent wedges. Relative minor sits inside the same wedge.','Modulate by moving one step clockwise or anticlockwise and treating the new key as temporary tonic.','Secondary dominants point to any of the six diatonic chords.'],'Write a 16-bar progression that starts in G, briefly visits D (V), then returns via the relative minor Em.','fifths'],

['Technique','Fret near the wire','Pressure needed drops sharply the closer you get to the fret wire. Less force means faster changes and fewer buzzes.'],
['Technique','Lift early','Release the old chord on the "and" before the new beat so your fingers arrive on time, not late.'],
['Technique','Float the pick hand','Rest only lightly on the guitar. A planted forearm blocks the strum arc and the top of the sound.'],
['Technique','Round the fingers','Arch each finger like a claw so neighbouring strings are not muted by the fleshy underside.'],
['Technique','Shake out','Tension is the real speed limit. Pause every few minutes and let the hands drop.'],
['Technique','Partial barres first','Master the top-three or top-four string barre before committing to a full six-string grip. Cleaner tone, less fatigue.'],
['Technique','Anchor the thumb','Keep the fretting-hand thumb roughly opposite the middle finger. Sliding it toward the headstock or body creates tension.'],
['Technique','Economy of motion','The shortest path between two frets is almost always the best. Watch for unnecessary lifts and stretches.'],
['Rhythm','Never stop the strum','Keep the strumming arm moving through every change, even if you miss strings.'],
['Rhythm','Tap your foot','Make the foot the clock. If it stops, the rhythm stops.'],
['Rhythm','Count aloud','Say "1 & 2 & 3 & 4 &" while you strum. Your voice locks the timing.'],
['Rhythm','Slow loops, tiny steps','Loop two bars and add only 5 BPM once four runs are clean.'],
['Rhythm','Mute the chuck','Brush the strings with the heel of the hand on beats 2 and 4 for a snare-like backbeat.'],
['Rhythm','Displace the downbeat','Occasionally omit the down-stroke on beat 1. The resulting anticipations create modern, pushing grooves.'],
['Rhythm','16th-note awareness','Even when playing 8ths, feel the 16ths underneath. It tightens the pocket dramatically.'],
['Harmony','I-IV-V in every key','In G the three big chords are G, C and D. Learn the same trio in C, D and A and hundreds of songs open up.'],
['Harmony','Relative minor','Every major key has a minor chord (the vi) sharing its notes. Em lives happily inside G.'],
['Harmony','Add9 and sus swaps','Cadd9 for C and Dsus4 for D add colour and share fingers with the basics.'],
['Harmony','Walk the bass','G to D/F# to Em: the bass descends by step, and the chords suddenly sound professional.'],
['Harmony','Aim for the 3rd','When soloing, land on the 3rd of the current chord. It always names the harmony.'],
['Harmony','One shape, any key','An E-shape barre moves anywhere. Its root is the note on the low E string.'],
['Harmony','Secondary dominant','The V of any diatonic chord creates strong forward motion. D7 resolving to G is the classic example in C major.'],
['Harmony','Borrowed bVII','The flat-VII chord (Bb in C, F in G) is the most useful modal interchange chord in rock, folk and pop.'],
['Harmony','Common-tone retention','When changing chords, keep any shared notes stationary. The ear hears continuity even if other voices move.'],
['Harmony','Clockwise is a fifth up','On the circle of fifths the neighbour on your right is the V chord and the one on your left is the IV. Two taps give you the other main chords of any key.'],
['Harmony','Name the shape','Whenever you play a barre chord, ask which CAGED shape it is. That tells you where the other four versions of the same chord live.'],
['Harmony','Triads sit on top','Triads on the top three strings leave the low strings to the bass, so they work well in a band and over a drone.'],
['Technique','Arpeggio box','Learn one five-fret box per chord instead of a whole-neck scale. Fewer shapes, faster results.'],
['Practice','Slow is smooth','Smooth practised slowly becomes fast. Fast practised sloppily becomes sloppy.'],
['Practice','Chord first, strum second','Place the chord without strumming, check every string, then add the strum.'],
['Practice','Record weekly','Your ear hears things in a recording that you miss while playing.'],
['Practice','End on success','Finish each session with something you can play well. You will want to come back.'],
['Practice','Songs beat exercises','Each practice should include a real song. Motivation is a technique too.'],
['Practice','Isolate the failure','If a change fails at 90 BPM, loop only the two chords at 60 until they are automatic, then raise tempo.'],
['Practice','Micro-sessions','Five focused minutes on one micro-skill beats thirty minutes of unfocused playing.'],
['Tone','Pick position','Strum over the end of the fingerboard for warmth, nearer the bridge for brightness.'],
['Tone','Fresh strings','Dull, hard-to-tune strings are usually just old strings. Change them every few months with regular playing.'],
['Tone','Mind the humidity','Wood moves. Aim for roughly 40-50% relative humidity to protect the neck and top.'],
['Tone','Tune after the capo','A capo can nudge pitch. Re-check the tuning once it is on.'],
['Tone','Nail and flesh balance','Fingerstyle players: a small amount of nail adds clarity and projection without sounding brittle.'],

['Lead','Space is music','Leave rests. Continuous streams of notes lose impact. Silence frames the good ideas.']];

 return s+'</div><div id="drnow" aria-live="polite" style="margin-top:10px">'+drNow()+'</div><p class="muted">Start at 60 BPM. Aim to land on the new shape on beat 1 of each bar, then add 5 BPM after four clean rounds.</p></div>'}
/* ---------- Colour & Lead fretboard ---------- */
var DEGL={0:'1',1:'b2',2:'2',3:'b3',4:'3',5:'4',6:'b5',7:'5',8:'b6',9:'6',10:'b7',11:'7'};S.ln=false;S.lb='all';S.lt=[];
function leadSet(){var r={pcs:[],root:0,pos:null},i,st;
 if(S.lead==='modes'){r.root=MAJS[S.mi];for(i=0;i<7;i++)r.pcs.push(MAJS[(S.mi+i)%7])}
 else if(S.lead==='phryg'){r.root=4;r.pcs=[4,5,8,9,11,0,2]}
 else if(S.lead==='blues'){st=BL[S.bl].s;r.pos=st;r.root=(OPEN[st[0][0]]+st[0][1])%12;st.forEach(function(n){var p=(OPEN[n[0]]+n[1])%12;if(r.pcs.indexOf(p)<0)r.pcs.push(p)})}
 return r}
function leadBoard(){var q=leadSet(),dots=[],st,f,pc,on,tri=S.lead==='tri';
 if(tri){var t=TRI[S.ti];[t.b].concat(t.t).forEach(function(n,j){dots.push({s:n[0],f:n[1],c:j?TC[1]:TC[0],t:NOTES[(OPEN[n[0]]+n[1])%12],v:OPEN[n[0]]+n[1]})})}
 else for(st=0;st<6;st++)for(f=0;f<=15;f++){pc=(OPEN[st]+f)%12;if(q.pcs.indexOf(pc)<0)continue;
  on=inBox(q,st,f);
  dots.push({s:st,f:f,c:pc===q.root?TC[0]:TC[1],t:S.ln?DEGL[(pc-q.root+12)%12]:NOTES[pc],v:OPEN[st]+f,o:on?1:.3})}
 return'<div class="card"><h2>Fretboard</h2><p class="muted">'+(tri?'The bass note (red) and the triad (blue) from the tab above. Tap any dot to hear it.':'Every note of the scale across the neck. Red is the root, blue the rest.'+(q.pos?' Solid dots are the open-position shape from the tab; faded dots are the same scale higher up.':'')+' Tap any dot to hear it.')+'</p>'+(tri?'':'<div class="row" style="margin-bottom:6px">'+bt('lnm',0,!S.ln,'Note names')+bt('lnm',1,S.ln,'Scale degrees')+'</div>')+boxUi(q,tri)+boardSvg(dots,(tri||S.lb==='all')?null:boxWin(q,S.lb))+'</div>'}
function boxWin(q,j){var n=q.pcs.length,s=((q.pcs[j%n]-OPEN[0])%12+12)%12,a=Math.max(0,s-1),w=[[a,s+3]];if(a+12<=13)w.push([a+12,Math.min(s+15,15)]);return w}
function inBoxJ(q,j,st,f){var w=j<0?null:boxWin(q,j);if(w)return w.some(function(r){return f>=r[0]&&f<=r[1]});return!q.pos||q.pos.some(function(n){return n[0]===st&&n[1]===f})}
function inBox(q,st,f){return inBoxJ(q,S.lb==='all'?-1:S.lb,st,f)}
function boxUi(q,tri){if(tri)return'';var n=q.pcs.length,j,w,s='<div class="row" style="margin-bottom:6px">'+bt('lbox','all',S.lb==='all','All');
 for(j=0;j<n;j++)s+=bt('lbox',j,S.lb===j,'Box '+(j+1));
 s+='</div>';
 if(S.lb==='all')return s+'<p class="muted">Pick a box to see one playable shape. Then \u25b6 Scale plays that box up and down and lights each dot as it sounds.</p>';
 w=boxWin(q,S.lb);return s+'<p class="muted">Box '+(S.lb+1)+' starts on <b>'+NOTES[q.pcs[S.lb%n]]+'</b> on the low E string and spans frets '+w.map(function(r){return r[0]+'\u2013'+r[1]}).join(' and ')+'. Faded dots are outside the box.</p>'}
function leadSeq(){if(S.lead==='tri')return null;var q=leadSet(),j=S.lb==='all'?(q.pos?-1:0):S.lb,o=[],st,f,seen={},m;
 for(st=0;st<6;st++)for(f=0;f<=15;f++)if(q.pcs.indexOf((OPEN[st]+f)%12)>=0&&inBoxJ(q,j,st,f))o.push([st,f]);
 o.sort(function(a,b){return(OPEN[a[0]]+a[1])-(OPEN[b[0]]+b[1])||a[0]-b[0]});
 return o.filter(function(n){m=OPEN[n[0]]+n[1];if(seen[m])return false;seen[m]=1;return true})}
function litOff(){var e=document.querySelectorAll('.lit'),i;for(i=0;i<e.length;i++)e[i].classList.remove('lit')}
function litClear(){(S.lt||[]).forEach(clearTimeout);S.lt=[];litOff()}
function litPlay(sq){litClear();var m=stepMidi(sq),t=ac().currentTime+.05;m.forEach(function(n,i){pluck(n,t+i*.2,.8)});
 sq.forEach(function(n,i){S.lt.push(setTimeout(function(){litOff();var e=document.querySelector('[data-p="'+n[0]+'_'+n[1]+'"]');if(e)e.classList.add('lit')},50+i*200))});
 S.lt.push(setTimeout(litOff,150+sq.length*200))}
/* ---------- timers ---------- */
var trT=null,prT=null;
function trTick(){S.tr.left--;if(S.tr.left<=0){var key=S.tr.a+'-'+S.tr.b;if(S.tr.count>(D.best[key]||0)){D.best[key]=S.tr.count}save();S.tr.run=false;clearInterval(trT);pluck(81,0,.8)}
 if(S.tab==='chords'){if(S.tr.run){document.getElementById('trclock').textContent=S.tr.left}else render()}}
function prTick(){var p=S.pr;p.left--;D.log[today()]=(D.log[today()]||0)+1;save();
 if(p.left<=0){pluck(81,0,.9);if(p.blk<p.blocks.length-1){p.blk++;p.left=p.blocks[p.blk].s}else{p.run=false;clearInterval(prT);p.blk=0;p.left=0}render()}
 else{var e=document.getElementById('prclock');if(e)e.textContent=fmt(p.left);if(p.left%30===0)stats()}}
/* ---------- events ---------- */
document.addEventListener('click',function(e){var el=e.target,a,v,i;while(el&&el!==document&&!el.getAttribute('data-a'))el=el.parentNode;if(!el||el===document)return;a=el.getAttribute('data-a');v=el.getAttribute('data-v');ac();
 if(a==='tab'){litClear();stopDrone();if(S.play)stopPlay();S.tab=v;render()}
 else if(a==='lsub'){litClear();stopDrone();S.lead=v;S.lb='all';render()}
 else if(a==='lmode'){stopDrone();S.mi=+v;render()}
 else if(a==='ltri'){S.ti=+v;render()}
 else if(a==='lblues'){stopDrone();S.bl=v;render()}
 else if(a==='lplay'){leadPlay()}
 else if(a==='ldrone'){leadDrone();render()}
 else if(a==='chord'){S.chord=v;render();strum(v,'D',0,.9)}
 else if(a==='strum'){if(v==='D')strum(S.chord,'D',0,.9);else{var st=strings(S.chord);for(i=0;i<st.length;i++)pluck(midi(S.chord,st[i]),ac().currentTime+i*.18,.8)}}
 else if(a==='str'){var si=+v;pluck(midi(S.chord,si),0,.9)}
 else if(a==='addprog'){if(S.prog.length<8)S.prog.push(S.chord);S.tab='rhythm';render()}
 else if(a==='delprog'){S.prog.splice(+v,1);if(!S.prog.length&&S.play)stopPlay();else render()}
 else if(a==='mode'){S.mode=v;S.pat=v==='strum'?'Old faithful':'Travis';render()}
 else if(a==='pat'){S.pat=v;render()}
 else if(a==='play'){S.poff=0;S.play?stopPlay():startPlay()}
 else if(a==='trgo'){if(S.tr.run){S.tr.run=false;clearInterval(trT)}else{S.tr.run=true;S.tr.left=60;S.tr.count=0;clearInterval(trT);trT=setInterval(trTick,1000)}render()}
 else if(a==='trhit'){trHit()}
 else if(a==='fbnew'){newFb();render()}
 else if(a==='fblab'){S.fb.labels=!S.fb.labels;render()}
 else if(a==='fbhit'&&S.fb.t){var s=+el.getAttribute('data-s'),f=+el.getAttribute('data-f');pluck(OPEN[s]+f,0,.9);var ok=(OPEN[s]+f)%12===S.fb.t.n&&s===S.fb.t.s;
  if(ok){S.fb.streak++;if(S.fb.streak>D.fbBest){D.fbBest=S.fb.streak;save()}S.fb.msg='<span class="good">Correct! Fret '+f+'.</span>';newFb();render()}
  else{S.fb.streak=0;S.fb.msg='<span class="bad">That was '+NOTES[(OPEN[s]+f)%12]+' on the '+SN[s]+' string. Try again.</span>';render()}}
 else if(a==='capokey'){S.capoKey=+v;render()}
 else if(a==='pdur'){S.pr.dur=+v;S.pr.blocks=blocks(+v);S.pr.blk=0;S.pr.left=0;S.pr.run=false;clearInterval(prT);render()}
 else if(a==='prgo'){if(S.pr.run){S.pr.run=false;clearInterval(prT)}else{S.pr.run=true;clearInterval(prT);prT=setInterval(prTick,1000)}render()}
 else if(a==='prskip'){var p=S.pr;if(p.blk<p.blocks.length-1){p.blk++;p.left=p.blocks[p.blk].s}render()}
 else if(a==='prgoto'){S.tab=S.pr.blocks[S.pr.blk].t;render()}
 else if(a==='lsw'){S.ls=v;render()}
 else if(a==='lopen'){S.ol=S.ol===+v?-1:+v;render()}
 else if(a==='ltool'){stopDrone();S.tab=v;if(v==='chords'&&S.ol===1)S.chord='F';else if(v==='chords'&&(S.ol===0||S.ol===2))S.chord='Bm';render()}
 else if(a==='ldone'){D.done[v]=!D.done[v];save();render()}
 else if(a==='hcat'){S.hc=v;render()}
 else if(a==='htry'){D.tried[v]=!D.tried[v];save();render()}
 else if(a==='emode'){S.ear={m:v,q:null,st:0,msg:''};render()}
 else if(a==='enew'){S.ear.msg='';newEar();render()}
 else if(a==='erep'){playEar()}
 else if(a==='eans'&&S.ear.q){var e=S.ear,A=e.m==='int'?INT:QUA;if(+v===e.q.a){e.st++;if(e.st>D.earBest){D.earBest=e.st;save()}e.msg='<span class="good">Correct: '+A[+v][0]+'.</span>';newEar();render()}else{e.st=0;e.msg='<span class="bad">That was '+A[e.q.a][0]+'. Listen again.</span>';render();playEar()}}
 else if(a==='bkey'){if(S.play)stopPlay();S.key=+v;render()}
 else if(a==='bhear'){strum(cid(S.key,+v),'D',0,.9)}
 else if(a==='badd'){if(S.play)stopPlay();if(S.bp.length<8)S.bp.push(+v);render()}
 else if(a==='bdel'){if(S.play)stopPlay();S.bp.splice(+v,1);render()}
 else if(a==='bpre'){if(S.play)stopPlay();S.bp=PRE[+v][1].slice();render()}
 else if(a==='bplay'){if(S.play)stopPlay();else if(S.bp.length){S.prog=S.bp.map(function(d){return cid(S.key,d)});S.poff=0;startPlay()}}
 else if(a==='sgsel'){if(S.play)stopPlay();S.sg=+v;var g=SONGS[+v];S.bpm=g.bpm;S.mode=g.m;S.pat=g.p;render()}
 else if(a==='shear'){strum(v,'D',0,.9)}
 else if(a==='slearn'){D.sec[S.sg+':'+v]=!D.sec[S.sg+':'+v];save();render()}
 else if(a==='sfull'){if(S.play)stopPlay();else songStart(sflat(SONGS[S.sg]),0)}
 else if(a==='sloop'){var g2=SONGS[S.sg],off=0,j;for(j=0;j<g2.form.length&&g2.form[j]!==v;j++)off+=4;songStart(sbars(g2,v),off)}
 else if(a==='fifth'){var fq1=S.fq;if(fq1.on&&fq1.q){if(+v===fq1.q.a){fq1.st++;if(fq1.st>D.fifBest){D.fifBest=fq1.st;save()}fq1.msg='<span class="good">Correct!</span>';newFq()}else{fq1.st=0;fq1.msg='<span class="bad">Not quite: that was '+CMA[+v]+'. Try again.</span>'}render()}else{S.fi=+v;render();strum(cid(CP[S.fi],0),'D',0,.9)}}
 else if(a==='fqz'){S.fq={on:!S.fq.on,q:null,st:0,msg:''};if(S.fq.on)newFq();render()}
 else if(a==='fplay'){var fk=CP[S.fi],ft=ac().currentTime+.05;[0,3,4,0].forEach(function(d,j){strum(cid(fk,d),'D',ft+j*1.2,.9)})}
 else if(a==='fbuild'){if(S.play)stopPlay();S.key=CP[S.fi];S.bp=[0,3,4,0];S.tab='build';render()}
 else if(a==='fhear'){strum(cid(CP[S.fi],+v),'D',0,.9)}
 else if(a==='cgkey'){S.ck=+v;render()}
 else if(a==='cgsel'){S.cg=v;render();if(v!=='all')strum('cg'+v,'D',0,.9)}
 else if(a==='lbox'){litClear();S.lb=v==='all'?'all':+v;render()}
 else if(a==='lnote'){pluck(+v,0,.9)}
 else if(a==='lnm'){S.ln=v==='1';render()}
 else if(a==='home'){litClear();stopDrone();if(S.play)stopPlay();S.tab='learn';render();window.scrollTo(0,0)}
 else if(a==='dmode'){var nm=v==='1';if(nm!==S.dmj){S.dk=(S.dk+(nm?3:9))%12;S.dmj=nm;S.dp=0}if(S.play&&S.drill)dstart();else render()}
 else if(a==='dkey'||a==='dpre'){if(a==='dkey')S.dk=+v;else S.dp=+v;if(S.play&&S.drill)dstart();else render()}
 else if(a==='dplay'){if(S.play&&S.drill)stopPlay();else dstart()}
 else if(a==='trk'||a==='trq'||a==='trs'||a==='tri'){if(a==='trk')S.tk=+v;else if(a==='trq')S.tq=v;else if(a==='trs')S.ts=+v;else S.tv=+v;render();triPlay(triVoice(),ac().currentTime+.02,true)}
 else if(a==='trhear'){var tv0=S.tv,tt=ac().currentTime+.05,tj;if(v==='w'){for(tj=0;tj<3;tj++){S.tv=tj;triPlay(triVoice(),tt+tj*1.3,true)}S.tv=tv0}else triPlay(triVoice(),tt,v==='b')}
 else if(a==='ark'||a==='arq'||a==='arr'){if(a==='ark')S.ak=+v;else if(a==='arq')S.aq=v;else S.ar=+v;render()}
 else if(a==='arplay'){var am=stepMidi(arpNotes());playScale(v==='ud'?am.concat(am.slice(0,-1).reverse()):am,.22)}
 else if(a==='cgmm'){S.cm=v==='1';render()}
 else if(a==='cghear'){strum('cg'+v,'D',0,.9)}
 else if(a==='tune'){pluck(OPEN[+v],0,1)}});
document.addEventListener('change',function(e){var a=e.target.getAttribute('data-a');
 if(a==='bpat'){var pv=e.target.value.split(':');S.mode=pv[0]==='s'?'strum':'finger';S.pat=pv[1];render()}else if(a==='skey'){if(S.play)stopPlay();S.sk=+e.target.value;render()}else if(a==='tra'){S.tr.a=e.target.value;render()}else if(a==='trb'){S.tr.b=e.target.value;render()}
 else if(a==='padd'&&e.target.value!=='+ add'&&S.prog.length<8){S.prog.push(e.target.value);render()}});

document.addEventListener('keydown',function(e){
  if((e.code==='Enter'||e.code==='Space')&&e.target&&e.target.classList&&e.target.classList.contains('wg')){
   e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return;

   e.preventDefault();trHit();
  }
 });
function trHit(){if(!S.tr.run)return;S.tr.count++;var k=S.tr.count%2?S.tr.b:S.tr.a;strum(k,'D',0,.8);document.getElementById('trcount').textContent=S.tr.count}
